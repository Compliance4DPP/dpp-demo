name: CI
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Format (opa fmt for policy, Prettier for web)
        run: make fmt-check
      - name: Policy tests (opa test)
        run: make test
      - name: Frontend script parses
        run: node --check web/app.js
      - name: Compose file is valid
        run: docker compose config -q
