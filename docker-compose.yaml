services:
  opa:
    image: openpolicyagent/opa:1.22.0
    command: ["run", "--server", "--addr=0.0.0.0:8181", "/policy"]
    volumes: ["./policy:/policy:ro"]
  web:
    image: nginx:1.31.8-alpine
    ports: ["127.0.0.1:8082:80"]
    volumes: ["./web:/usr/share/nginx/html:ro", "./samples:/samples:ro", "./nginx.conf:/etc/nginx/conf.d/default.conf:ro"]
    depends_on: [opa]
