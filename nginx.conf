server {
  listen 80;
  root /usr/share/nginx/html;
  add_header Cache-Control no-cache;  # demo files change often; always revalidate
  location /samples/ { alias /samples/; }
  # only these two OPA endpoints are reachable (no policy upload etc.)
  # issuer's public DID document for in-browser signature verification (the origin sends no CORS header);
  # ${VC_DID_HOST} is filled in by the nginx image's envsubst at start
  location = /did.json { proxy_pass https://${VC_DID_HOST}/.well-known/did.json; proxy_ssl_server_name on; }
  location ~ ^/v1/data/dpp/report(_tech)?$ { limit_except POST { deny all; } proxy_pass http://opa:8181; }
}
