server {
  listen 80;
  root /usr/share/nginx/html;
  add_header Cache-Control no-cache;  # demo files change often; always revalidate
  location /samples/ { alias /samples/; }
  # only these two OPA endpoints are reachable (no policy upload etc.)
  # issuer's public DID document for in-browser signature verification (the origin sends no CORS header);
  # ${VC_DID_HOST} is filled in by the nginx image's envsubst at start
  # the host is looked up per request (Docker's DNS), so nginx still starts when the issuer cannot be resolved
  resolver 127.0.0.11 valid=30s;
  set $did_host "${VC_DID_HOST}";
  location = /did.json { proxy_pass https://$did_host/.well-known/did.json; proxy_ssl_server_name on; }
  location ~ ^/v1/data/dpp/report(_tech)?$ {
    limit_except POST { deny all; }
    # no query strings: OPA's ?explain=full returns the evaluation trace, which contains the private key
    if ($is_args) { return 400; }
    client_max_body_size 20m;  # AAS files can exceed nginx's 1 MB default
    proxy_pass http://opa:8181;
  }
}
