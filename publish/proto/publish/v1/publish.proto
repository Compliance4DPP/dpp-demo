syntax = "proto3";

package dppdemo.publish.v1;

option go_package = "dpp-demo/publish/gen/publishv1;publishv1";

service Publisher {
  // Signs the template's credentials with the gaia-x-signer and publishes the template's
  // offering through the Ecosystems Gateway.
  rpc Publish(PublishRequest) returns (PublishResponse);
}

message PublishRequest {
  oneof dpp {
    // Name of a DPP file in DPP_DIR, without the .json extension, e.g. "valid_dpp"
    string dpp_name = 1;
    // The DPP itself, as AAS JSON
    bytes dpp_json = 2;
  }
  // Name of a template directory in TEMPLATE_DIR, e.g. "default"
  string template = 3;
}

message PublishResponse {
  // Identifier(s) of the published offering, e.g. did:ope:...
  repeated string offering_ids = 1;
  // The signed credentials as compact JWS, by credential template name
  map<string, string> credentials = 2;
}
