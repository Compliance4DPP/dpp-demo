syntax = "proto3";

// Minimal, wire-compatible client view of the gaia-x-signer gRPC API
// (https://git.dumss.net/theia/gaia-x-signer, proto/sdbs/gaia-x-signer/service.proto).
// Only SignVC is used. Package, service and field numbers must match the upstream definition,
// as they make up the method path /sdbs.s3example.signer/SignVC and the wire format.
package sdbs.s3example;

import "google/protobuf/struct.proto";

option go_package = "dpp-demo/publish/gen/signerpb;signerpb";

service signer {
  // Signs a Verifiable Credential with the signer's configured DID and key.
  rpc SignVC(VC) returns (VC);
}

message VC {
  oneof vc {
    // Compact JWS
    string jwtld = 2;
    // JSON-LD object
    google.protobuf.Struct jsonld = 3;
  }
}
