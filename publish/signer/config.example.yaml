# gaia-x-signer config (copy to publish/signer/config.yaml, put the signing key next to it as
# key.pem). All options: https://git.dumss.net/theia/gaia-x-signer/-/blob/main/config.yaml
sdbs:
  uid: https://signer.sdbs.dumss.net/v1
  withHealthServer: true
  dependencyCheckInterval: 6000 #ms
  tcpConfig:
    address: 0.0.0.0:50050
authServer:
  basicIdentityProvider:
    basicAuths:
      - base64: ZGVtbzp0ZXN0 # demo:test, change it; publish/.env SIGNER_AUTHORIZATION must match
gxCompliance:
  DID: "did:web:example.org"
  verificationMethod: "did:web:example.org#key-1"
  notaryURL: "https://www.delta-dao.com/notary/v2/"
  complianceURL: "https://compliance.lab.gaia-x.eu/development/api/credential-offers"
  version: loire
  privateKeyPath: ./key.pem
  signatureAlgorithm: ES256
